[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manuscript-validator"
version = "0.1.0"
description = "Validates and auto-corrects medical-journal manuscripts against a journal formatting template."
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "python-docx>=1.2.0",
    "lxml>=5.0",
    "pydantic>=2.7",
    "platformdirs>=4.0",
    "tenacity>=9.0",
    "google-genai>=2.0",
]

[project.optional-dependencies]
# Kept separate so the Linux dev box never installs pywin32 and CI can run
# the full pipeline suite without a display.
gui = ["PySide6>=6.6"]
windows = ["pywin32>=306"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.0",
]

[project.scripts]
manuscript-validator = "manuscript_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Rule configs and prompts are loaded via importlib.resources, never by
# __file__-relative paths -- see docs/decisions.md (C5).
manuscript_validator = ["rules/config/*.json", "rules/prompts/*.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = []
markers = [
    "live: hits the real Gemini API (costs tokens; run before a release)",
    "windows: requires Windows APIs (DPAPI, PyInstaller)",
    "gui: requires Qt; run with QT_QPA_PLATFORM=offscreen",
    "slow: takes more than a few seconds",
]
# Default run is offline and platform-clean.
addopts = "-m 'not live and not windows'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["manuscript_validator"]

[[tool.mypy.overrides]]
# None of these ship type stubs.
module = ["docx.*", "lxml.*", "win32crypt.*"]
ignore_missing_imports = true
